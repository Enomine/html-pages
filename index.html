<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Pages</title>
  <style>
    :root { --bg: #fafafa; --fg: #222; --muted: #777; --link: #0b63ce; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #eee; --muted: #999; --link: #6cb0ff; }
    }
    body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-top: 1px solid rgba(128,128,128,.25); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>HTML Pages</h1>
    <p>이 repo에 올린 HTML 파일 목록입니다. 파일을 추가하면 아래 링크도 같이 갱신하세요.</p>
    <ul>
      <li><a href="pages/sample.html">pages/sample.html</a> — 자리표시용 샘플</li>
    </ul>
  </main>
</body>
</html>
